name: ink_engine
description: >-
  Ink engine: stroke building and rendering, pens, erasers, lasso geometry,
  page templates and thumbnails (INK).
publish_to: none
version: 0.0.1
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: 3.47.9
dependencies:
  flutter:
    sdk: flutter
  note_core: any
  riverpod: 3.4.3
  meta: 1.19.0
  flutter_math_fork: 0.7.4
  flutter_svg: 2.3.0                   # 간접 고정
  vector_graphics: 1.2.3               # 간접 고정
  vector_graphics_compiler: 1.3.0      # 간접 고정
dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: 1.3.3
  perfect_freehand: 2.5.2+1

flutter:
  assets:
    - assets/fonts/NoteSans-Regular.ttf
    - assets/fonts/NoteSans-Bold.ttf
    - assets/fonts/OFL.txt
