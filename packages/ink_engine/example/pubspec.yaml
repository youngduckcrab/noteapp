# ink lab (03-ink T23, INK-O1): one page, the five pens, erasers, lasso and the
# developer numbers on the CORE fake store — for M0 checks on the iPad before
# EDITOR is integrated.
#
# Workspace member since the integration step (INFRA-O1, 01-infra 1.3): the
# root `workspace:` list, `allowed_dependencies: ink_lab: [note_core,
# ink_engine]`, `lib_exceptions: packages/ink_engine/example/lib/` (lib/ uses
# the testing.dart helpers) and the `web-experiment` target `ink_lab`. It is an
# app, not a public package: R14 skips it (`app_members`).
name: ink_lab
description: ink lab — the ink engine on one page with the CORE fake store.
publish_to: none
version: 0.0.1
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: 3.47.9
dependencies:
  flutter:
    sdk: flutter
  ink_engine: any
  note_core: any
  riverpod: 3.4.3
  material_ui: 1.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
