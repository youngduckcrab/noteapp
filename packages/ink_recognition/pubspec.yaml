# packages/ink_recognition/pubspec.yaml — created by INFRA in the 2차
# foundation step R2-B1 and handed to LIBRARY (docs/plans/m5-7/05-library.md
# 3.3, 01-infra.md 3.3, contract 00-overview 7.5 v2.1). Versions are exact
