name: ink_recognition
description: Handwriting / math recognition ports, ML Kit adapter, indexer, conversion UI (LIBRARY area).
publish_to: none
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: 3.47.9
dependencies:
  flutter:
    sdk: flutter
  note_core: any
  ink_engine: any
  flutter_riverpod: 3.4.3
  material_ui: 1.10.0
  meta: 1.19.0
  collection: 1.19.1
  google_mlkit_digital_ink_recognition: 0.16.1   # *_native.dart only, `as mlkit`
  http: 1.6.0
  # ondevice/*_native.dart only (native_only_imports): the on-device math
  # engine (ONNX Runtime) and its model files in the app support directory.
  flutter_onnxruntime: 1.9.0
  path_provider: 2.1.6
  crypto: 3.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: 1.3.3
