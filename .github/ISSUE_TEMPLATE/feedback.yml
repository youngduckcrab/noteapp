# Feedback form (INFRA, docs/plans/01-infra.md 6.13 이슈 템플릿, PLAN 9.3).
name: 피드백
description: 앱을 써 보면서 겪은 문제나 의견을 남겨요.
title: '[피드백] '
body:
  - type: markdown
    attributes:
      value: |
        써 주셔서 고마워요. 아는 만큼만 채워도 괜찮아요.
        웹 버전은 테스트용이에요. 중요한 노트는 쓰지 말아 주세요.

  - type: dropdown
    id: device
    attributes:
      label: 기기
      options:
        - iPad Pro 13
        - 안드로이드 태블릿
        - 기타
    validations:
      required: true

  - type: input
    id: pencil
    attributes:
      label: 펜슬 종류
      description: 'iPad 설정 → 일반 → 정보에서 모델 이름을 볼 수 있어요. 손가락으로 썼다면 "손가락"이라고 적어 주세요.'
      placeholder: 예) Apple Pencil Pro

  - type: input
    id: app-version
    attributes:
      label: 앱 버전
      description: 앱의 설정 → 앱 정보에 있는 빌드 라벨을 그대로 붙여 넣어 주세요.
      placeholder: 예) 0.1.0 (#42 · a1b2c3d · main)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 무엇을 했나요
      description: 어느 화면에서 무엇을 눌렀는지 순서대로 적어 주세요.
      placeholder: |
        1. 라이브러리에서 '새 노트'를 눌렀어요
        2. 펜슬로 글씨를 썼어요
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 진단 정보 (선택)
      description: 앱의 설정 → 앱 정보 → '진단 정보 복사'를 누른 뒤 여기에 붙여 넣어 주세요. 앱이 시작되지 않으면 시작 오류 화면의 '진단 정보 복사'를 써요.
      render: text

  - type: textarea
    id: media
    attributes:
      label: 스크린샷 · 화면 녹화 (선택)
      description: 파일을 이 칸에 끌어다 놓으면 올라가요.
