# iOS TestFlight — DRAFT, unverified (INFRA, docs/plans/01-infra.md 6.13
# `ios-testflight.yml`, 6.15; docs/plans/m5-7/01-infra.md 6.11.6 — 2차 J3;
# docs/guides/06-ios-testflight.md). Completed at the native stage. macOS
# runners bill 10x the free minutes, so the job runs only when started by
# hand, with `confirm` = yes, and only after the repository variable
# IOS_TESTFLIGHT_ENABLED is set to `true`. Run ios-compile.yml first (it
# needs no account).
#
# Secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (the
# content of the App Store Connect API key .p8 file).
#
# Signing, chosen by the repository variable IOS_SIGNING_MODE:
# - `cloud` (default, unset): Xcode cloud signing through the API key
#   (-allowProvisioningUpdates). Reports say cloud signing may need an Admin
#   API key — an App Manager key can fail here (research 04 summary 11).
# - `manual`: an Apple Distribution certificate and an App Store profile made
#   by hand (works with an App Manager key) — secrets IOS_DIST_P12_BASE64
#   (the .p12, base64), IOS_DIST_P12_PASSWORD and IOS_PROFILE_BASE64 (the
#   .mobileprovision, base64), loaded into a temporary keychain.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'macOS 10배 과금 확인: yes 입력'
        type: string
        required: true

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload to TestFlight (draft)
    if: vars.IOS_TESTFLIGHT_ENABLED == 'true' && inputs.confirm == 'yes'
    # A fixed label (macos-latest moves) — the same as ios-compile.yml.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      IOS_SIGNING_MODE: ${{ vars.IOS_SIGNING_MODE || 'cloud' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build info
        run: dart run tool/ws.dart build-info --channel live --out build/build_info.json

      - name: App Store Connect API key
        run: |
          key_path="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Manual signing only: the certificate into a temporary keychain, the
      # profile into the provisioning profiles folder.
      - name: Certificate and profile (manual signing)
        if: env.IOS_SIGNING_MODE == 'manual'
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$IOS_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$profiles/$uuid.mobileprovision"
          {
            echo "IOS_KEYCHAIN=$keychain"
            echo "IOS_PROFILE_NAME=$name"
            echo "IOS_BUNDLE_ID=${app_id#*.}"
          } >> "$GITHUB_ENV"

      - name: Flutter iOS build (no signing)
        working-directory: app
        run: flutter build ios --release --no-codesign --build-number=$GITHUB_RUN_NUMBER --dart-define-from-file=../build/build_info.json

      - name: Archive
        working-directory: app/ios
        run: |
          if [ "$IOS_SIGNING_MODE" = manual ]; then
            signing=(
              CODE_SIGN_STYLE=Manual
              "CODE_SIGN_IDENTITY=Apple Distribution"
              "PROVISIONING_PROFILE_SPECIFIER=$IOS_PROFILE_NAME"
            )
          else
            signing=(
              -allowProvisioningUpdates
              -authenticationKeyPath "$ASC_KEY_PATH"
              -authenticationKeyID "$ASC_KEY_ID"
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
              CODE_SIGN_STYLE=Automatic
            )
          fi
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            "${signing[@]}"

      # ExportOptions.plist: method app-store-connect, destination upload,
      # signingStyle automatic; manual signing names the certificate and the
      # profile.
      - name: Export and upload
        working-directory: app/ios
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          cp ExportOptions.plist "$options"
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$options"
          if [ "$IOS_SIGNING_MODE" = manual ]; then
            plutil -replace signingStyle -string manual "$options"
            plutil -replace signingCertificate -string 'Apple Distribution' "$options"
            /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$options"
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $IOS_PROFILE_NAME" "$options"
          fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [ -n "${IOS_KEYCHAIN:-}" ]; then security delete-keychain "$IOS_KEYCHAIN" || true; fi
