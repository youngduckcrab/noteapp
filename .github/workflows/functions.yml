# Server functions (INFRA workflow, SYNC scripts — docs/plans/m5-7/01-infra.md
# 6.14, contract 00-overview 7.4.7, V13): `npm ci`, `npm test` (at least one
# test), `npm run test:emulator` (SYNC's node emulator tests — still Node
# only: functions/scripts/emulator_suite.sh runs without the heavy-test lock
# when CI=true, 07-sync RQ-8), then Flutter and the Dart `emulator` tests of
# ink_recognition (LIBRARY) inside one more `firebase emulators:exec` — the
# container path of tool/README.md without `with-heavy-lock` (one job per
# runner: the lock is always free here). 2차 J16 completes the R2-B1
# skeleton.
#
# Runs only when its paths change, or by hand (the free Actions minutes —
# 01-infra 6.16). Without functions/ every step after the checkout is skipped
# (`hashFiles` guard on each step — it cannot be used in a job-level `if:`)
# and the summary says so. No secrets: the emulator reads the committed demo
# values of functions/.env.demo-noteapp (SYNC).
name: Functions

on:
  push:
    paths:
      - 'functions/**'
      - 'app/firebase.json'
      - '.github/workflows/functions.yml'
      - 'packages/ink_recognition/**'
  workflow_dispatch:

concurrency:
  group: functions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  functions:
    name: Server functions (npm and emulator tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        if: hashFiles('functions/package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        if: hashFiles('functions/package.json') != ''
        working-directory: functions
        run: npm ci

      # Contract 7.4.7: the run must have run at least one test (node --test
      # prints `# tests N` with the TAP reporter, `ℹ tests N` with spec).
      - name: Unit tests
        if: hashFiles('functions/package.json') != ''
        working-directory: functions
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.log"
          count="$(grep -Eo '^(# |ℹ )tests [0-9]+' "$RUNNER_TEMP/npm-test.log" | tail -n 1 | grep -Eo '[0-9]+$' || true)"
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "::error::npm test ran no test (tests: ${count:-not reported})"
            exit 1
          fi
          echo "## 서버 함수" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm test: 시험 ${count}개 통과" >> "$GITHUB_STEP_SUMMARY"

      # Before Flutter (07-sync RQ-8). `# tests 0` passes: the emulator test
      # files come with SYNC S2-11 (07-sync I-0); the count goes to the
      # summary.
      - name: Emulator tests
        if: hashFiles('functions/package.json') != ''
        working-directory: functions
        run: |
          set -o pipefail
          npm run test:emulator 2>&1 | tee "$RUNNER_TEMP/npm-emulator.log"
          count="$(grep -Eo '^(# |ℹ )tests [0-9]+' "$RUNNER_TEMP/npm-emulator.log" | tail -n 1 | grep -Eo '[0-9]+$' || true)"
          echo "- npm run test:emulator: 시험 ${count:-?}개 통과" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Flutter
        if: hashFiles('functions/package.json') != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      # Same key as ci.yml step 3 (note_core's sqlite3 hook, for the VM test
      # build).
      - name: Cache build hooks
        if: hashFiles('functions/package.json') != ''
        uses: actions/cache@v6
        with:
          path: .dart_tool/hooks_runner
          key: hooks-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-${{ runner.os }}-

      - name: Dependencies
        if: hashFiles('functions/package.json') != ''
        run: flutter pub get --enforce-lockfile

      # LIBRARY's CallableMathRecognizer against the emulator (05-library
      # L2-I6, V13). firebase is functions/'s devDependency (npx --prefix);
      # no emulator-tagged test yet → `ws test` reports "no matching tests"
      # and passes.
      - name: Dart emulator tests
        if: hashFiles('functions/package.json') != ''
        run: npx --prefix functions firebase emulators:exec --config app/firebase.json --only functions,auth --project demo-noteapp "dart run tool/ws.dart test --package ink_recognition --run-skipped -t emulator"

      - name: Skipped (no functions/)
        if: hashFiles('functions/package.json') == ''
        run: |
          echo '## 서버 함수' >> "$GITHUB_STEP_SUMMARY"
          echo '- functions/ 없음 — 건너뜀 (SYNC R2-B7b 전)' >> "$GITHUB_STEP_SUMMARY"
