# Android APK (INFRA, docs/plans/01-infra.md 6.13 `android.yml`, 6.14;
# docs/plans/m5-7/01-infra.md 6.10.3 v2): release APK for arm64 tablets,
# published as a pre-release `android-<run>` with the APK file attached
# (docs/guides/05-android-apk.md). Not a workflow artifact: artifacts count
# against the account's storage quota, which Android APK run 6 hit; release
# files do not, and a tablet downloads the .apk itself (no zip). The newest
# three APK releases are kept, older ones are deleted with their tags.
#
# Manual only (2차 R2-B1 — the free Actions minutes, docs/plans/m5-7/
# 01-infra.md 6.16): Actions → Android APK → Run workflow. GitHub offers Run
# workflow for the workflows of the default branch — now the development
# branch claude/note-app-planning-bk29xb (the remote has no main yet) — and
# the branch to build can be chosen there. The channel is `live` for main and
# `preview` for every other branch (as in ci.yml).
#
# Signing (2차 J2, contract V14 v2.1 — D2-7): the fixed sideload key from the
# repository secrets (docs/guides/07-android-signing.md), so a new APK
# installs over the previous one and keeps the notes. Three ways:
# - the four ANDROID_* secrets are set → app/android/key.properties, the
#   release key, file `noteapp-apk-<run>.apk`; the certificate must match the
#   ANDROID_CERT_SHA256 variable when it is set;
# - a secret is missing but ANDROID_CERT_SHA256 is set (the repository uses
#   the fixed key: deleted or misspelled secret, a fork) → the job fails
#   before the build — an APK that cannot be installed over is never made;
# - neither (before the fixed key) → the template's debug key, made fresh on
#   every runner, file `noteapp-debug-signed-<run>.apk`.
# The container has no Android SDK: this workflow is only checked on GitHub
# (tool/test/workflows_test.dart runs its shell steps with fake tools).
name: Android APK

on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The one job that writes: `gh release` creates the android-<run>
    # pre-release and deletes older APK releases (tool/test/workflows_test.dart
    # allows only this). Manual runs only, by the repository owner.
    permissions:
      contents: write
    # `if:` cannot read secrets: the steps read them from here.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Before any setup, so a missing key fails in seconds. key.properties is
      # read by app/android/app/build.gradle.kts (rootProject.file) and is
      # gitignored; the passwords are made of letters and digits (guide 07),
      # so the properties file needs no escaping.
      - name: Signing
        id: signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
            && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > app/android/key.properties
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ -n "$ANDROID_CERT_SHA256" ]; then
            echo "::error::고정 키 서명 재료가 없어요 — 이 APK는 덮어 설치할 수 없어 만들지 않아요(docs/guides/07-android-signing.md)"
            exit 1
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      # Generated Android project: AGP 9.1.0, Gradle 9.3.1, Kotlin 2.4.0,
      # Java 17 target.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Flutter 3.47.9's default NDK (FlutterExtension.kt ndkVersion) is not
      # on the runner image; Gradle downloads it on a cache miss.
      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ndk-28.2.13676358

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      # Same key as ci.yml step 3. The sqlite3 build hook (note_core) downloads
      # its binary from the GitHub release when the cache misses.
      - name: Build hooks (downloads sqlite3 when not cached)
        uses: actions/cache@v6
        with:
          path: .dart_tool/hooks_runner
          key: hooks-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-${{ runner.os }}-

      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      # The update checker is off outside the web, so the channel only labels
      # the build (About section).
      - name: Build info
        env:
          BUILD_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'live' || 'preview' }}
        run: dart run tool/ws.dart build-info --channel "$BUILD_CHANNEL" --out build/build_info.json

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --split-per-abi --build-number=$GITHUB_RUN_NUMBER --dart-define-from-file=../build/build_info.json

      # apksigner of the newest build-tools. A release APK whose certificate is
      # not ANDROID_CERT_SHA256 fails (the secrets hold another key).
      - name: Check signature
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          apk=app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          # The whole output goes to the log.
          if ! out=$("$apksigner" verify --print-certs "$apk" 2>&1); then
            printf '%s\n' "$out"
            echo "::error::apksigner could not verify $apk"
            exit 1
          fi
          printf '%s\n' "$out"
          # 'Signer #1 certificate SHA-256 digest: …', 'Signer (minSdkVersion=…)
          # certificate …' or 'V2 Signer: certificate …' (run 6): the first one.
          digest=$(printf '%s\n' "$out" | sed -n 's/^.*certificate SHA-256 digest: *//p' | head -n 1)
          if [ -z "$digest" ]; then
            if [ "$SIGNING_MODE" = release ]; then
              echo "::error::apksigner printed no SHA-256 digest for $apk"
              exit 1
            fi
            # A debug build is never compared, so a missing line only warns.
            echo "::warning::apksigner printed no SHA-256 digest for $apk"
          fi
          expected=$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ "$SIGNING_MODE" = release ] && [ -n "$expected" ] && [ "$digest" != "$expected" ]; then
            echo "::error::서명 지문 $digest 이(가) ANDROID_CERT_SHA256와 달라요 — 시크릿에 다른 키가 들어 있어요(docs/guides/07-android-signing.md)"
            exit 1
          fi
          if [ "$SIGNING_MODE" = release ]; then
            echo "서명: 고정 키 (${digest:0:16})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "서명: debug 키 — 이전 APK 위에 덮어 설치할 수 없어요. 설치가 안 되면 앱을 지우지 말고 알려 주세요" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          APK_NAME: noteapp-${{ steps.signing.outputs.mode == 'release' && 'apk' || 'debug-signed' }}-${{ github.run_number }}
        run: |
          tag="android-$GITHUB_RUN_NUMBER"
          file="$RUNNER_TEMP/$APK_NAME.apk"
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$file"
          if [ "$SIGNING_MODE" = release ]; then
            notes="고정 키 판이에요. 이전 고정 키 판 위에 덮어 설치해요(docs/guides/05-android-apk.md)."
          else
            notes="덮어 설치할 수 없는 시험판(debug 키)이에요. 실제 노트가 든 기기에는 설치하지 마세요(docs/guides/05-android-apk.md)."
          fi
          gh release create "$tag" "$file" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "$APK_NAME" --notes "$notes"
          # Keep the newest three APK releases; older ones go with their tags.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("android-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
          echo "다운로드: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag — $APK_NAME.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"
