# CI — checks, analysis, tests, web build and Firebase Hosting deploy in one
# job (INFRA, docs/plans/01-infra.md 6.13: one job keeps the per-minute
# rounding of the free minutes low; docs/plans/m5-7/01-infra.md 6.16 for the
# 2차 budget). main deploys to the live channel, every other branch to its
# own 7-day preview channel (`ws channel-id`, 6.12) — also the repository's
# default branch while that is not main (now the development branch
# claude/note-app-planning-bk29xb: the remote has no main yet).
#
# Test scope (step "Test scope", 2차 R2-B1 — the free 2,000 minutes a month
# of a private repository; one full run measured 30 minutes after the 1차
# integration):
# - main, or a manual run with the input `full`: the strict check and every
#   member.
# - the default branch (not main): only the members changed since the
#   previous push of the branch (`--affected-since <github.event.before>`)
#   and their dependents. Without a previous push (all-zero or empty
#   `before`: a new branch, a manual run) every member; a `before` that is not
#   in the history (force push) falls back to every member through
#   `--all-if-no-base`. Each of these pushes tests only its own change, so
#   none of them is cancelled or replaced by the next one (one concurrency
#   group per run there).
# - other branches: the members changed since the default branch
#   (`--affected-since origin/<default branch>`) and their dependents;
#   without that base (no such remote branch, no merge base)
#   `--all-if-no-base` tests every member.
# The strict check (warnings fail) runs on main, the default branch and
# manual full runs.
#
# Without the secret FIREBASE_SERVICE_ACCOUNT or the repository variable
# FIREBASE_PROJECT_ID the deploy step is skipped and the summary points to
# docs/guides/02-github-secrets.md. `if:` cannot read `secrets` directly, so
# both values come in through the job `env`.
#
# Each timed `run` step ends by writing "<seconds> <label>" to
# $RUNNER_TEMP/step-seconds ($SECONDS = time spent in that step's shell); the
# summary step prints them as the per-step timing table.
name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Firebase Hosting에 배포 (live 또는 미리보기 채널)'
        type: boolean
        default: true
      integration:
        description: '통합 태그 테스트 실행 (통합 단계 G2 이후)'
        type: boolean
        default: false
      full:
        description: '전체 실행 (모든 멤버 + check --strict — 끄면 바뀐 멤버만)'
        type: boolean
        default: false

# Default-branch pushes (not main) test only their own change, so each gets
# its own group (never cancelled or replaced); everything else cancels the
# older run of the same ref.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref_name == github.event.repository.default_branch && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Check, test, build and deploy web
    runs-on: ubuntu-latest
    # A full run (every member, VM and Chrome) on the 2-core runner of a
    # private repository: measured 30 minutes after the 1차 integration (VM
    # tests 15, Chrome tests 10, web build 1 — m5-7/01-infra 6.16), more with
    # the integration input.
    timeout-minutes: 60
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      # Inputs of the "Test scope" step.
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BEFORE_SHA: ${{ github.event.before }}
      FULL_INPUT: ${{ inputs.full }}
    steps:
      - name: Start clock
        run: date +%s > "$RUNNER_TEMP/ci-start"

      # Sets FULL_RUN (every member), STRICT_CHECK and AFFECTED_BASE (the
      # --affected-since ref when FULL_RUN is false) for the later steps.
      - name: Test scope
        run: |
          zero=0000000000000000000000000000000000000000
          strict=false
          base=''
          if [ "$GITHUB_REF" = 'refs/heads/main' ] || [ "$FULL_INPUT" = 'true' ]; then
            full=true
            strict=true
            scope='전체 (main 또는 수동 full)'
          elif [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            strict=true
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "$zero" ]; then
              full=true
              scope='전체 (기본 브랜치 — 이전 푸시 없음)'
            else
              full=false
              base="$BEFORE_SHA"
              scope="기본 브랜치 — ${BEFORE_SHA:0:7} 이후 바뀐 멤버"
            fi
          else
            full=false
            base="origin/$DEFAULT_BRANCH"
            scope="$DEFAULT_BRANCH 대비 바뀐 멤버"
          fi
          {
            echo "FULL_RUN=$full"
            echo "STRICT_CHECK=$strict"
            echo "AFFECTED_BASE=$base"
            echo "TEST_SCOPE=$scope"
          } >> "$GITHUB_ENV"
          echo "test scope: $scope (full=$full strict=$strict base=$base)"

      # 1
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and every branch: `--affected-since
          # origin/<default branch>` needs the merge base, `--affected-since
          # <github.event.before>` the previous push.
          fetch-depth: 0

      # 2
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Root pubspec.yaml `environment.flutter: 3.47.9` (D10). `cache`
          # covers the SDK and the pub cache (key: **/pubspec.lock).
          flutter-version-file: pubspec.yaml
          cache: true

      # 3 — native build hook outputs at the workspace root: the sqlite3
      # prebuilt library, the PDFium binary and pdfium_dart's gate library.
      - name: Cache build hooks
        uses: actions/cache@v6
        with:
          path: .dart_tool/hooks_runner
          key: hooks-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-${{ runner.os }}-

      # 4 — the files each member's tool/prepare_web_test.dart copies or
      # downloads for the Chrome tests (contract 7.4.8). A changed path only
      # misses the cache; the scripts fetch again and nothing fails.
      - name: Cache browser test assets
        uses: actions/cache@v6
        with:
          path: |
            packages/note_core/test/web/sqlite3.wasm
            packages/note_core/test/web/drift_worker.js
            packages/pdf_io/test/web/pdfium/
            app/test/web/sqlite3.wasm
            app/test/web/drift_worker.js
          key: prep-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'tool/web_assets.yaml', '**/tool/prepare_web_test.dart') }}

      # 5
      - name: Dependencies
        run: |
          printf '%s %s\n' "$(( $(date +%s) - $(cat "$RUNNER_TEMP/ci-start") ))" '준비 (체크아웃 · Flutter · 캐시)' >> "$RUNNER_TEMP/step-seconds"
          flutter pub get --enforce-lockfile
          printf '%s %s\n' "$SECONDS" '의존성' >> "$RUNNER_TEMP/step-seconds"

      # 6
      - name: Workspace rules (strict)
        if: env.STRICT_CHECK == 'true'
        run: |
          dart run tool/ws.dart check --strict
          printf '%s %s\n' "$SECONDS" '규칙 (check --strict)' >> "$RUNNER_TEMP/step-seconds"

      - name: Workspace rules
        if: env.STRICT_CHECK != 'true'
        run: |
          dart run tool/ws.dart check
          printf '%s %s\n' "$SECONDS" '규칙 (check)' >> "$RUNNER_TEMP/step-seconds"

      # 7
      - name: Analyze
        run: |
          dart run tool/ws.dart analyze
          printf '%s %s\n' "$SECONDS" '분석' >> "$RUNNER_TEMP/step-seconds"

      # 8 — without FULL_RUN only the members changed since AFFECTED_BASE
      # and their dependents (PDF `pdfium` tests too — PDF-S8).
      - name: VM tests (all members)
        if: env.FULL_RUN == 'true'
        run: |
          dart run tool/ws.dart test
          printf '%s %s\n' "$SECONDS" 'VM 테스트' >> "$RUNNER_TEMP/step-seconds"

      - name: VM tests (affected)
        if: env.FULL_RUN != 'true'
        run: |
          dart run tool/ws.dart test --affected-since "$AFFECTED_BASE" --all-if-no-base
          printf '%s %s\n' "$SECONDS" 'VM 테스트 (바뀐 멤버)' >> "$RUNNER_TEMP/step-seconds"

      # Contract 7.6 B1 v1.3 / 7.7 V3: the workspace tool's own tests.
      - name: Tool tests
        run: |
          dart test tool/test
          printf '%s %s\n' "$SECONDS" '도구 테스트' >> "$RUNNER_TEMP/step-seconds"

      # 9 — `ws` runs each member's tool/prepare_web_test.dart first. Uses the
      # runner's google-chrome (unverified; if it is missing add
      # browser-actions/setup-chrome and CHROME_EXECUTABLE).
      - name: Browser tests (all members)
        if: env.FULL_RUN == 'true'
        run: |
          dart run tool/ws.dart test --platform chrome
          printf '%s %s\n' "$SECONDS" '브라우저 테스트' >> "$RUNNER_TEMP/step-seconds"

      - name: Browser tests (affected)
        if: env.FULL_RUN != 'true'
        run: |
          dart run tool/ws.dart test --platform chrome --affected-since "$AFFECTED_BASE" --all-if-no-base
          printf '%s %s\n' "$SECONDS" '브라우저 테스트 (바뀐 멤버)' >> "$RUNNER_TEMP/step-seconds"

      # 10 — manual only (integration stage G2 and later). On push `inputs`
      # is empty, so the condition is false.
      - name: Integration tests (VM)
        if: inputs.integration == true
        run: |
          dart run tool/ws.dart test --run-skipped -t integration
          printf '%s %s\n' "$SECONDS" '통합 테스트 (VM)' >> "$RUNNER_TEMP/step-seconds"

      - name: Integration tests (Chrome)
        if: inputs.integration == true
        run: |
          dart run tool/ws.dart test --platform chrome --run-skipped -t integration
          printf '%s %s\n' "$SECONDS" '통합 테스트 (Chrome)' >> "$RUNNER_TEMP/step-seconds"

      # 11 — Hosting channel id (`id`) and build channel (`build`). Live is
      # main only, not "the default branch": the development branch keeps
      # its preview channel while it is the default branch.
      - name: Channel
        id: channel
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            echo 'id=live' >> "$GITHUB_OUTPUT"
            echo 'build=live' >> "$GITHUB_OUTPUT"
          else
            channel_id="$(dart run tool/ws.dart channel-id --branch "$GITHUB_REF_NAME")"
            echo "id=$channel_id" >> "$GITHUB_OUTPUT"
            echo 'build=preview' >> "$GITHUB_OUTPUT"
          fi

      # 12
      - name: Build info
        env:
          BUILD_CHANNEL: ${{ steps.channel.outputs.build }}
        run: dart run tool/ws.dart build-info --channel "$BUILD_CHANNEL" --out build/build_info.json

      # 13 — a missing sqlite3.wasm would be answered by index.html (rewrite).
      - name: Verify web assets
        run: dart run tool/ws.dart web-assets verify

      # 14
      - name: Web build
        working-directory: app
        run: |
          flutter build web --release --no-wasm-dry-run --dart-define-from-file=../build/build_info.json --build-number=$GITHUB_RUN_NUMBER
          printf '%s %s\n' "$SECONDS" '웹 빌드' >> "$RUNNER_TEMP/step-seconds"

      # 15 — also writes the main.dart.js size to the step summary.
      - name: Finalize web build
        run: |
          dart run tool/ws.dart finalize-web --build-dir app/build/web --info build/build_info.json
          date +%s > "$RUNNER_TEMP/deploy-start"

      # 16 — `expires` applies to preview channels only.
      - name: Deploy to Firebase Hosting
        id: deploy
        if: env.FIREBASE_SA != '' && env.FIREBASE_PROJECT_ID != '' && (github.event_name == 'push' || inputs.deploy)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: ${{ steps.channel.outputs.id }}
          expires: 7d
          entryPoint: app
          firebaseToolsVersion: 15.34.1
          # No repoToken: nothing is posted to GitHub.
          disableComment: true

      # 17
      - name: Summary
        if: always()
        env:
          CHANNEL_ID: ${{ steps.channel.outputs.id }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_URL: ${{ steps.deploy.outputs.details_url }}
          DEPLOY_REQUESTED: ${{ github.event_name == 'push' || inputs.deploy }}
        run: |
          {
            echo '## 빌드 결과'
            echo
            if [ -f build/build_info.json ]; then
              label="$(jq -r '"\(.APP_VERSION) (#\(.APP_BUILD_NUMBER) · \(.APP_GIT_SHA[0:7]) · \(.APP_GIT_REF))"' build/build_info.json)"
              echo "- 빌드 라벨: \`$label\`"
            else
              echo '- 빌드 라벨: (빌드 정보 없음 — 앞 단계에서 멈춤)'
            fi
            echo "- 채널: \`${CHANNEL_ID:-없음}\`"
            echo "- 시험 범위: ${TEST_SCOPE:-정해지지 않음}"
            if [ "$DEPLOY_OUTCOME" = 'success' ]; then
              echo "- 주소: $DEPLOY_URL"
              if [ -f "$RUNNER_TEMP/deploy-start" ]; then
                printf '%s %s\n' "$(( $(date +%s) - $(cat "$RUNNER_TEMP/deploy-start") ))" '배포' >> "$RUNNER_TEMP/step-seconds"
              fi
            elif [ -z "$FIREBASE_SA" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
              echo '- 주소: Firebase 미설정 — docs/guides/02-github-secrets.md'
            elif [ "$DEPLOY_REQUESTED" != 'true' ]; then
              echo '- 주소: 배포하지 않음 (수동 실행에서 deploy 끔)'
            elif [ "$DEPLOY_OUTCOME" = 'failure' ]; then
              echo '- 주소: 배포 실패 — Deploy 단계 로그를 확인해 주세요'
            else
              echo '- 주소: 배포 단계까지 가지 못함'
            fi
            echo
            echo '| 단계 | 시간 |'
            echo '|---|---|'
            if [ -f "$RUNNER_TEMP/step-seconds" ]; then
              while read -r seconds label; do
                echo "| $label | ${seconds}초 |"
              done < "$RUNNER_TEMP/step-seconds"
            fi
            if [ -f "$RUNNER_TEMP/ci-start" ]; then
              echo "| 전체 (요약 전까지) | $(( $(date +%s) - $(cat "$RUNNER_TEMP/ci-start") ))초 |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
