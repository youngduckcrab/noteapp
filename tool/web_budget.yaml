  startup_fonts_raw_max: 700000
  startup_font_bundles:                  # per bundle (contract 7.4.5 v2.1, v2.4 C24-01; null = report only)
    katex: {family_prefix: packages/flutter_math_fork/, gzip_max: 380000}   # C24-01
