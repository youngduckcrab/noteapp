    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  note_core: any
  ink_engine: any
  feature_editor: any
  feature_library: any
  pdf_io: any
  flutter_riverpod: 3.4.3
  material_ui: 1.10.0
  go_router: 18.1.2
  cupertino_icons: 2.0.0
  web: 1.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: 1.3.3
flutter:
  uses-material-design: true
