name: noteapp
description: Note app shell (INFRA) — bootstrap, routing, settings frame.
publish_to: none
version: 0.1.0+1
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: 3.47.9
# 00-overview 7.1: this scope's app does NOT depend on sync_engine (added at
# the M4 connection together with the allowed_dependencies edge).
dependencies:
