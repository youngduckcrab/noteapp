# The CI runner has 16 GB for Gradle, the Kotlin daemon, R8, three Dart AOT
# builds and CMake together; the template's 8 GB heap + 4 GB metaspace (also
# inherited by the Kotlin daemon) got the runner shut down mid-build.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
